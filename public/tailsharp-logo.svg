<svg viewBox="0 0 560 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E4A37"/>
      <stop offset="1" stop-color="#072A1F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD566"/>
      <stop offset="1" stop-color="#F2A91B"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(10,10)">
    <rect width="120" height="120" rx="28" fill="url(#bg)"/>
    <polyline points="32,54 60,26 88,54" fill="none" stroke="url(#gold)"
              stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="36,78 60,54 84,78" fill="none" stroke="#FFFFFF" opacity="0.55"
              stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="40,99 60,79 80,99" fill="none" stroke="#FFFFFF" opacity="0.22"
              stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="158" y="88" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" letter-spacing="1">
    <tspan fill="#0B3D2E">TAIL</tspan><tspan fill="#E89B0C">SHARP</tspan>
  </text>
  <text x="161" y="116" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" letter-spacing="6" fill="#5B7268">FOLLOW THE SIGNAL</text>
</svg>
